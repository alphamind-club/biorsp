[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "biorsp"
version = "3.0.0"
description = "BioRSP: Radial Spatial Patterning analysis for single-cell directional gene expression"
authors = [
    { name = "Zeyu Yao", email = "novodoodle@gmail.com" },
    { name = "Jake Y. Chen", email = "jakechen@uab.edu" },
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
]
requires-python = ">=3.8"
readme = "README.md"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "matplotlib-venn>=1.1.0",
    "upsetplot>=0.9.0",
]
plotting = ["matplotlib>=3.9.0", "matplotlib-venn>=1.1.0", "upsetplot>=0.9.0"]

[tool.setuptools]
packages = ["biorsp"]
